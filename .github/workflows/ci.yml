name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./core[dev]"

      - name: Lint (syntax and undefined names)
        run: ruff check core/src core/tests --select E9,F63,F7,F82

      - name: Test
        working-directory: core
        run: python -m pytest -q --timeout=180

  docbench:
    name: docbench (schema and graph)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install jsonschema rdflib

      - name: Compile scripts
        run: python -m py_compile benchmark/docbench/*.py

      - name: Claim model tests
        run: python -m unittest discover -s benchmark/docbench/tests -v

      - name: Validate example claims against the schema
        run: python benchmark/docbench/check_claims.py --schema-only benchmark/docbench/gold/claims.example.jsonl

      - name: Build and parse the Turtle graph
        run: |
          python benchmark/docbench/build_ttl.py \
            --claims benchmark/docbench/gold/claims.example.jsonl \
            --out /tmp/docbench.ttl
          python - <<'PY'
          import rdflib
          graph = rdflib.Graph()
          graph.parse("/tmp/docbench.ttl", format="turtle")
          print(f"{len(graph)} triples")
          assert len(graph) > 0
          PY

  mcp:
    name: mcp (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp

      - name: Test
        run: cargo test --locked --manifest-path mcp/Cargo.toml

  retrieval:
    name: retrieval (harness, no network)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pytest ruff numpy scipy snowballstemmer

      - name: Lint (syntax, undefined names, unused imports)
        # Scoped to the files this harness owns: the rest of benchmark/tests has
        # pre-existing debt that a retrieval change has no business rewriting.
        run: ruff check benchmark/retrieval benchmark/tests/test_retrieval_*.py --select E9,F63,F7,F82,F401,F841

      - name: Test the metric layer, the split and the runner
        # These tests are offline by construction: they build their own corpora
        # and never call an adapter that streams from the Hub. The locator tests
        # that need the compiled corpora skip themselves, because those corpora
        # are derived artifacts and are not in the repository.
        run: python -m pytest -q benchmark/tests/test_retrieval_*.py

      - name: The harness imports
        run: |
          python -c "import benchmark.retrieval.adapters, benchmark.retrieval.metrics, benchmark.retrieval.partition, benchmark.retrieval.runner, benchmark.retrieval.baselines, benchmark.retrieval.locator"
