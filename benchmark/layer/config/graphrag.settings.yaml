# GraphRAG, as it was actually run.
#
# This is `graphrag init` output (GraphRAG 3.3.0) with four differences, and the
# list was produced by diffing against a clean `graphrag init` rather than from
# memory:
#
#   1. the chat model is deepseek-v4.1-flash, with api_base pointed at a local
#      meter proxy, so every call is counted by the same meter as every other
#      system's;
#   2. the embedding model is e5-large-v2 behind a local sidecar (1,024
#      dimensions, CPU, 512 tokens), again through the same declared endpoint —
#      every system in the pilot uses the same embeddings, which is what makes
#      the comparison a comparison;
#   3. the retry policy is written out (8 attempts, 2-60 s, jitter) because the
#      gateway's failures are timeouts, not rate limits, and GraphRAG's default
#      backoff is shorter than a long generation takes;
#   4. `concurrent_requests` is 4, against GraphRAG's default of 25. The pilot's
#      gateway realises a 60-second ceiling on non-streamed replies, and a pool of
#      25 turns that ceiling into a queue of failures. The meter proxy streams
#      upstream, which removes the ceiling, but the build ran at 4 and the number
#      is published at 4.
#
# Everything else is untouched, and untouched is a claim worth being able to
# check: chunking 1,200 tokens with 100 overlap, one gleaning pass in
# extract_graph, extract_claims disabled, community reports 2,000/8,000, no
# snapshots, entity types organization/person/geo/event. The prompts are
# GraphRAG's own, taken from the installed 3.3.0 package: pinning the version
# pins them.
#
# `${GRAPHRAG_API_KEY}` is read from the environment and is never a literal here;
# the embedding key is the sidecar's placeholder, which authorises nothing.

### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

completion_models:
  default_completion_model:
    model_provider: openai
    model: deepseek-v4.1-flash
    auth_method: api_key # or azure_managed_identity
    api_key: ${GRAPHRAG_API_KEY}
    api_base: http://127.0.0.1:8094/v1
    retry:
      type: exponential_backoff
      max_retries: 8
      base_delay: 2
      max_delay: 60
      jitter: true

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: e5-large-v2
    auth_method: api_key
    api_key: local-sidecar
    api_base: http://127.0.0.1:8091/v1
    retry:
      type: exponential_backoff
      max_retries: 8
      base_delay: 2
      max_delay: 60
      jitter: true

### Document processing settings ###

input:
  type: text # [csv, text, json, jsonl]

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, sqlite, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "cache"
  # database_name: "cache.db" # Only used when type is sqlite
    
vector_store:
  type: lancedb
  db_uri: output/lancedb

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [organization,person,geo,event]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

concurrent_requests: 4

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
